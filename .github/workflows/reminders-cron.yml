name: Study Reminders Worker

on:
  schedule:
    # Runs every 15 minutes on GitHub free tier
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -X POST "https://www.prepplan.si/api/reminders/run" \
            -H "Authorization: Bearer $CRON_SECRET"
